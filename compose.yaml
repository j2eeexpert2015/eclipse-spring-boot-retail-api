services:
  retail-postgres:
    image: postgres:16-alpine
    container_name: retail-postgres
    environment:
      POSTGRES_DB: retaildb
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retaildb"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - retail-postgres-data:/var/lib/postgresql/data

  retail-api:
    build: .
    container_name: retail-api
    depends_on:
      retail-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://retail-postgres:5432/retaildb
      SPRING_DATASOURCE_USERNAME: retail
      SPRING_DATASOURCE_PASSWORD: retail
    ports:
      - "8080:8080"

volumes:
  retail-postgres-data:
